user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen 80;
        server_name _;

        # 设置根目录为默认html目录
        root /usr/share/nginx/html;
        index index.html;

        # 配置gzip压缩
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
        gzip_vary on;

        # 将根路径重定向到DECO27网站
        location = / {
            return 301 /DECO27-syoukai/;
        }

        # 处理DECO27网站的所有请求，支持Vue路由 - 这个规则应该放在最前面
        location /DECO27-syoukai/ {
            alias /usr/share/nginx/html/DECO27-syoukai/;
            try_files $uri $uri/ /DECO27-syoukai/index.html;
            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";
            add_header X-XSS-Protection "1; mode=block";
        }

        # 图片路径重写规则 - 解决绝对路径图片问题
        location ~* ^/image/(.*)$ {
            alias /usr/share/nginx/html/DECO27-syoukai/image/$1;
        }

        # assets路径重写规则 - 确保资源文件正确加载
        location ~* ^/assets/(.*)$ {
            alias /usr/share/nginx/html/DECO27-syoukai/assets/$1;
        }

        # 处理DECO27-syoukai/assets路径 - 确保资源文件正确加载
        location ~* ^/DECO27-syoukai/assets/(.*)$ {
            alias /usr/share/nginx/html/DECO27-syoukai/assets/$1;
        }

        # 静态文件缓存设置
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # 自定义错误页面
        error_page 404 /DECO27-syoukai/index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # 限制大文件请求
        client_max_body_size 20M;
    }
}